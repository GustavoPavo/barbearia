<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">JAROL Barber School</title>
  <defs>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d98b"/>
      <stop offset="45%" stop-color="#caa14a"/>
      <stop offset="100%" stop-color="#8a6a24"/>
    </linearGradient>
    <path id="topArc" d="M 24,100 A 76,76 0 1 1 176,100" fill="none"/>
    <path id="bottomArc" d="M 176,108 A 76,76 0 1 1 24,108" fill="none"/>
    <clipPath id="poleClip">
      <rect x="-9" y="-30" width="18" height="58" rx="9"/>
    </clipPath>
  </defs>

  <circle cx="100" cy="100" r="96" fill="#0c0c0d"/>
  <circle cx="100" cy="100" r="93" fill="none" stroke="url(#goldStroke)" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#goldStroke)" stroke-width="1.4" opacity="0.85"/>

  <text font-family="'Playfair Display', Georgia, serif" font-size="16.5" font-weight="700" letter-spacing="4" fill="url(#goldStroke)">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">JAROL</textPath>
  </text>
  <text font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="3.4" fill="url(#goldStroke)">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">BARBER &amp; SCHOOL</textPath>
  </text>

  <g transform="translate(100,103)">
    <g clip-path="url(#poleClip)">
      <rect x="-9" y="-30" width="18" height="58" fill="#f4f0e6"/>
      <g stroke="#b5342c" stroke-width="7">
        <line x1="-14" y1="-30" x2="6" y2="-10"/>
        <line x1="-14" y1="-18" x2="6" y2="2"/>
        <line x1="-14" y1="-6" x2="6" y2="14"/>
        <line x1="-14" y1="6" x2="6" y2="26"/>
        <line x1="-14" y1="18" x2="6" y2="38"/>
      </g>
      <g stroke="url(#goldStroke)" stroke-width="7">
        <line x1="-8" y1="-30" x2="12" y2="-10"/>
        <line x1="-8" y1="-18" x2="12" y2="2"/>
        <line x1="-8" y1="-6" x2="12" y2="14"/>
        <line x1="-8" y1="6" x2="12" y2="26"/>
        <line x1="-8" y1="18" x2="12" y2="38"/>
      </g>
    </g>
    <rect x="-9" y="-30" width="18" height="58" rx="9" fill="none" stroke="url(#goldStroke)" stroke-width="2"/>
    <rect x="-9.5" y="-35" width="19" height="8" rx="2.5" fill="url(#goldStroke)"/>
    <path d="M -8,28 L 8,28 L 5,39 L -5,39 Z" fill="url(#goldStroke)"/>
  </g>
</svg>
